name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0'

      - name: Download Apktool
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            --output "$RUNNER_TEMP/apktool.jar"

      - name: Build APK
        run: |
          java -jar "$RUNNER_TEMP/apktool.jar" b \
            --frame-path "$RUNNER_TEMP/apktool-framework" \
            "N.0.V.A. HD 1.1.4 All screens" \
            --output "$RUNNER_TEMP/nova-reborn-unsigned.apk"

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/signing.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            # Stable key from repository secrets: every build can update the previous install.
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            # No secrets (e.g. pull requests from forks): throwaway key, cannot update an existing install.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key."
            KEYSTORE_PASSWORD=android
            KEY_PASSWORD=android
            KEY_ALIAS=androiddebugkey
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/nova-reborn-debug.apk" \
            "$RUNNER_TEMP/nova-reborn-unsigned.apk"

          rm -f "$KEYSTORE"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "$RUNNER_TEMP/nova-reborn-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nova-reborn-debug-apk
          path: ${{ runner.temp }}/nova-reborn-debug.apk
          retention-days: 14
