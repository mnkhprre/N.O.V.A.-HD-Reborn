name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_data_url:
        description: Direct URL of the game data ZIP
        required: false
        default: https://archive.org/download/nova-1/Nova%201.zip

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;36.0.0'

      - name: Download Apktool and Baksmali dependencies
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            --output "$RUNNER_TEMP/apktool.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://repo.maven.apache.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar \
            --output "$RUNNER_TEMP/baksmali.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://repo.maven.apache.org/maven2/org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar \
            --output "$RUNNER_TEMP/dexlib2.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://repo.maven.apache.org/maven2/org/smali/util/2.5.2/util-2.5.2.jar \
            --output "$RUNNER_TEMP/smali-util.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://repo.maven.apache.org/maven2/com/google/guava/guava/27.1-android/guava-27.1-android.jar \
            --output "$RUNNER_TEMP/guava.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://repo.maven.apache.org/maven2/com/beust/jcommander/1.64/jcommander-1.64.jar \
            --output "$RUNNER_TEMP/jcommander.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://repo.maven.apache.org/maven2/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar \
            --output "$RUNNER_TEMP/jsr305.jar"

      - name: Download and validate game data
        env:
          GAME_DATA_URL: ${{ github.event.inputs.game_data_url || 'https://archive.org/download/nova-1/Nova%201.zip' }}
        run: |
          DATA_ZIP="$RUNNER_TEMP/nova-game-data.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "$GAME_DATA_URL" --output "$DATA_ZIP"

          if ! unzip -Z1 "$DATA_ZIP" | tr '[:upper:]' '[:lower:]' | grep -Fxq 'gameloft/games/nova/entities.pack'; then
            echo "::error::The game-data ZIP does not contain gameloft/games/nova/entities.pack (path check ignores letter case)"
            exit 1
          fi

          cp "$DATA_ZIP" "N.0.V.A. HD 1.1.4 All screens/assets/nova-game-data.zip"

      - name: Compile first-launch data installer
        run: |
          SOURCE_DIR="N.0.V.A. HD 1.1.4 All screens/smali/com/gameloft/android/TBFV/GloftNOHP/ML"
          CLASS_DIR="$RUNNER_TEMP/bootstrap-classes"
          DEX_DIR="$RUNNER_TEMP/bootstrap-dex"
          SMALI_DIR="$RUNNER_TEMP/bootstrap-smali"
          mkdir -p "$CLASS_DIR" "$DEX_DIR"

          javac -source 8 -target 8 -Xlint:-options \
            -bootclasspath "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d "$CLASS_DIR" "$SOURCE_DIR/BundledDataActivity.java"

          "$ANDROID_HOME/build-tools/36.0.0/d8" \
            --min-api 8 \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
            --output "$DEX_DIR" \
            "$CLASS_DIR"/com/gameloft/android/TBFV/GloftNOHP/ML/BundledDataActivity*.class

          BAKSMALI_CP="$RUNNER_TEMP/baksmali.jar:$RUNNER_TEMP/dexlib2.jar:$RUNNER_TEMP/smali-util.jar:$RUNNER_TEMP/guava.jar:$RUNNER_TEMP/jcommander.jar:$RUNNER_TEMP/jsr305.jar"
          java -cp "$BAKSMALI_CP" org.jf.baksmali.Main disassemble \
            --output "$SMALI_DIR" "$DEX_DIR/classes.dex"

          cp "$SMALI_DIR"/com/gameloft/android/TBFV/GloftNOHP/ML/BundledDataActivity*.smali \
            "$SOURCE_DIR/"

      - name: Build APK
        run: |
          java -jar "$RUNNER_TEMP/apktool.jar" b \
            --frame-path "$RUNNER_TEMP/apktool-framework" \
            "N.0.V.A. HD 1.1.4 All screens" \
            --output "$RUNNER_TEMP/nova-reborn-unsigned.apk"

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/signing.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            # Stable key from repository secrets: every build can update the previous install.
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            # No secrets (e.g. pull requests from forks): throwaway key, cannot update an existing install.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key."
            KEYSTORE_PASSWORD=android
            KEY_PASSWORD=android
            KEY_ALIAS=androiddebugkey
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/nova-reborn-1.1.5-with-game-data.apk" \
            "$RUNNER_TEMP/nova-reborn-unsigned.apk"

          rm -f "$KEYSTORE"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "$RUNNER_TEMP/nova-reborn-1.1.5-with-game-data.apk"

      - name: Upload self-installing APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nova-reborn-1.1.5-with-game-data
          path: ${{ runner.temp }}/nova-reborn-1.1.5-with-game-data.apk
          retention-days: 14
